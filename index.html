<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Pacific Mattress</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:linear-gradient(135deg,#0f172a,#1e3a8a);
            color:#fff;
            text-align:center;
        }

        .container{
            background:rgba(255,255,255,0.08);
            padding:50px;
            border-radius:15px;
            backdrop-filter:blur(8px);
            box-shadow:0 10px 25px rgba(0,0,0,.3);
            max-width:600px;
            width:90%;
        }

        h1{
            font-size:3rem;
            margin-bottom:15px;
        }

        p{
            font-size:1.2rem;
            color:#e5e7eb;
            margin-bottom:30px;
            line-height:1.6;
        }

        .btn{
            display:inline-block;
            padding:14px 30px;
            background:#22c55e;
            color:#fff;
            text-decoration:none;
            border-radius:30px;
            font-size:1rem;
            font-weight:bold;
            transition:.3s;
        }

        .btn:hover{
            background:#16a34a;
            transform:translateY(-3px);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Welcome to Modern Pacific Mattress</h1>
    <p>
        Experience premium comfort with high-quality mattresses designed
        for better sleep, lasting durability, and exceptional value.
    </p>

    <a href="#" class="btn">Explore Our Products</a>
</div>

</body>
</html>
